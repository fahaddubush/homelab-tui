<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">HomeLab TUI</title>
  <desc id="desc">A violet and teal cosmic landscape with an orbiting ring, a small horizon and the words HomeLab TUI.</desc>
  <defs>
    <linearGradient id="night" x2="1" y2="1"><stop stop-color="#0b0b20"/><stop offset=".53" stop-color="#171331"/><stop offset="1" stop-color="#0c1c30"/></linearGradient>
    <radialGradient id="haze"><stop stop-color="#6266c9" stop-opacity=".34"/><stop offset="1" stop-color="#101026" stop-opacity="0"/></radialGradient>
    <radialGradient id="planet" cx=".33" cy=".24"><stop stop-color="#a8c5f2"/><stop offset=".4" stop-color="#7479c2"/><stop offset="1" stop-color="#1c284e"/></radialGradient>
    <linearGradient id="accent"><stop stop-color="#b5a3ff"/><stop offset=".52" stop-color="#e2a4db"/><stop offset="1" stop-color="#85e4dc"/></linearGradient>
  </defs>
  <rect width="1200" height="300" rx="18" fill="url(#night)"/>
  <ellipse cx="895" cy="150" rx="355" ry="215" fill="url(#haze)"/>
  <path d="M18 232 C260 166 391 280 630 210 S951 165 1182 216" fill="none" stroke="#7c75d2" stroke-opacity=".13" stroke-width="24"/>
  <path d="M0 279 C248 223 366 305 597 247 S982 219 1200 261" fill="none" stroke="#72cfc6" stroke-opacity=".11" stroke-width="35"/>
  <g fill="#ccd3ff"><circle cx="68" cy="45" r="1" opacity=".55"/><circle cx="184" cy="198" r="1.1" opacity=".55"/><circle cx="345" cy="42" r="1.3" opacity=".42"/><circle cx="456" cy="240" r="1" opacity=".55"/><circle cx="601" cy="55" r="1.1" opacity=".7"/><circle cx="693" cy="205" r="1" opacity=".6"/><circle cx="769" cy="45" r="1.1" opacity=".8"/><circle cx="1037" cy="58" r="1.2" opacity=".6"/><circle cx="1117" cy="231" r="1.2" opacity=".7"/><circle cx="920" cy="268" r="1" opacity=".6"/></g>
  <ellipse cx="920" cy="157" rx="181" ry="37" transform="rotate(-16 920 157)" fill="none" stroke="#91c7df" stroke-opacity=".32" stroke-width="3"/>
  <circle cx="920" cy="157" r="71" fill="url(#planet)"/>
  <path d="M751 205 C790 206 844 196 906 178 C970 159 1023 138 1067 116" fill="none" stroke="url(#accent)" stroke-opacity=".83" stroke-width="3"/>
  <circle cx="1095" cy="83" r="5" fill="#c9d7ff" fill-opacity=".7"/>
  <text x="72" y="126" fill="#c7bfff" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15" letter-spacing="5">YOUR SERVER, IN ORBIT</text>
  <text x="66" y="185" fill="#f3f0ff" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-weight="700" font-size="54" letter-spacing="2">homelab</text>
  <text x="72" y="223" fill="#9ba7c9" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="17">A living terminal for your Linux homelab.</text>
  <rect x="1" y="1" width="1198" height="298" rx="17" fill="none" stroke="#9990e4" stroke-opacity=".22"/>
</svg>
